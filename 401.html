<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>401 Unauthorized</title>

<style>
body{
  text-align:center;
  font-family:sans-serif;
  margin:0;
  background:#111;
  color:white;
}

h1{
  background:#333;
  margin:0;
  padding:1em;
}

video, canvas{
  width:400px;
  max-width:90%;
  margin-top:20px;
  border:4px solid white;
}

#msg{
  font-size:1.2em;
}
</style>

<body>

<h1>401 Unauthorized</h1>

<p id="msg">顔認証を開始します...</p>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");

async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:true
  });

  video.srcObject = stream;
  msg.textContent = "顔認証中... 3秒後に撮影します";

  setTimeout(takePhoto, 3000);
}

function takePhoto(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // 写真をcanvasに描く
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 暗めの赤フィルター
  ctx.fillStyle = "rgba(255,0,0,0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 枠線
  ctx.strokeStyle = "red";
  ctx.lineWidth = 20;
  ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

  // 大きな文字
  ctx.fillStyle = "white";
  ctx.font = "bold 80px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("DENIED", canvas.width / 2, canvas.height / 2);

  // 下の説明
  ctx.font = "bold 40px sans-serif";
  ctx.fillText("401 Unauthorized", canvas.width / 2, canvas.height / 2 + 70);

  msg.textContent = "認証に失敗しました。";

  // カメラ停止
  const stream = video.srcObject;
  stream.getTracks().forEach(track => track.stop());

  // videoを非表示
  video.style.display = "none";
}

startCamera();
</script>

</body>
</html>
